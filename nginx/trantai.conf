server {
    listen      1802;
    listen      [::]:1802;

    server_name 103.72.57.148 172.17.0.1;

    root        var/www/devops-hackathon-de001-tranvohuutai;
    index       index.html index.htm;

    access_log  /var/log/nginx/trantai.access.log;
    error_log   /var/log/nginx/trantai.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}